<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comenzi și picking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* VOICE: practic, de depozit — clar, rapid, fără podoabe
   IDEA: eticheta de raft și bonul de picking
   PICTURE: zona de încărcare, apoi listele însele, cu locații ca etichete de raft
   COLOUR and TYPE: galben de siguranță, negru, carton deschis; Barlow Condensed + Barlow
   LAYOUT: bandă de titlu cu dunga de avertizare, încărcare, cifre, trei file */
:root{color-scheme:light dark;--bg:light-dark(#f3efe6,#14130f);--ink:light-dark(#17160f,#f1eee4);--card:light-dark(#fffdf8,#1e1c16);--line:light-dark(#dcd5c4,#3a362b);--mut:light-dark(#655f52,#aaa492);--yel:#ffd21f;--red:light-dark(#b8241b,#ff8577);--ok:light-dark(#2f6b2a,#8fd283);--soft:light-dark(#f8f1d6,#2a2615)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
.hz{height:10px;background:repeating-linear-gradient(135deg,var(--yel) 0 14px,#17160f 14px 28px)}
.band{padding:clamp(20px,3vw,40px) max(4vw,14px)}
.wrap{max-width:1240px;margin:0 auto}
h1{font:800 clamp(32px,5vw,48px)/1.05 "Barlow Condensed",sans-serif;margin:0 0 6px;text-wrap:balance}
h2{font:800 26px/1.1 "Barlow Condensed",sans-serif;margin:0}
.sub{color:var(--mut);margin:0 0 20px;max-width:70ch}
.drop{border:2px dashed var(--line);border-radius:14px;background:var(--card);padding:28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;transition:border-color .15s,background .15s}
.drop.on{border-color:var(--ink);background:var(--soft)}
.drop b{font:800 24px/1.1 "Barlow Condensed",sans-serif;display:block}
.drop span{color:var(--mut)}
button,.btn{font:600 16px Barlow,sans-serif;min-height:44px;padding:0 18px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button.sm{min-height:36px;padding:0 12px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
input,select{font:16px Barlow,sans-serif;min-height:44px;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
.st b{font:800 30px/1 "Barlow Condensed",sans-serif;display:block}
.st small{color:var(--mut);font-size:14px}
.st.warn b{color:var(--red)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:2px solid var(--ink);margin-bottom:18px}
.tabs button{border-radius:10px 10px 0 0;border:2px solid var(--ink);border-bottom:0;background:transparent;color:var(--ink);font:800 20px "Barlow Condensed",sans-serif}
.tabs button[aria-selected=true]{background:var(--yel);color:#17160f}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 14px Barlow,sans-serif;color:var(--mut);background:var(--bg);position:sticky;top:0}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.nr{font:800 20px/1 "Barlow Condensed",sans-serif;white-space:nowrap}
.tag{display:inline-block;background:#17160f;color:var(--yel);font:800 17px/1 "Barlow Condensed",sans-serif;padding:5px 8px;border-radius:5px;white-space:nowrap}
.miss{color:var(--red);font-weight:600;white-space:nowrap}
.multi{display:inline-block;background:var(--yel);color:#17160f;font-size:13px;font-weight:600;border-radius:5px;padding:1px 7px;white-space:nowrap}
tr.grp td{border-top:2px solid var(--ink)}
tr.mlt td{background:var(--soft)}
@media(min-width:601px){#vBody table{min-width:1400px}#vBody .prod{min-width:360px}#vBody td:nth-child(3){white-space:nowrap}}
.batch{margin-bottom:26px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bh{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:12px 14px;background:var(--soft);border-bottom:2px solid var(--ink)}
.bh span{color:var(--mut)}
.prod{max-width:46ch}
.empty{padding:40px 20px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.locform{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
.note{font-size:14px;color:var(--mut);margin:6px 0 0}
.msg{min-height:22px;font-size:15px;margin:8px 0}
.msg.err{color:var(--red)}.msg.ok{color:var(--ok)}
.mrow input{width:84px;min-height:38px}
.acct{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:15px;color:var(--mut);margin-top:6px}
.team{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:14px;font-size:15px}
.team .dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.team.live .dot{background:#2fb344;box-shadow:0 0 0 4px color-mix(in srgb,#2fb344 25%,transparent)}
.team .grow{flex:1}
.team input{min-height:38px;width:170px}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--yel);color:#17160f;border-radius:12px;padding:12px 14px;margin-top:12px;font-weight:600}
.confirm button{background:#17160f;color:var(--yel);border-color:#17160f}.confirm button.ghost{background:transparent;color:#17160f}
.ck{display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.ck input{width:26px;height:26px;min-height:0;accent-color:#2f8f3a;cursor:pointer;margin:0}
.ck small{font-size:13px;color:var(--mut);max-width:9em;overflow:hidden;text-overflow:ellipsis}
tr.done td{background:light-dark(#e9f4e4,#17261a)!important;color:var(--mut)}
tr.done .tag{opacity:.55}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:#2f8f3a}
.batch.done .bh{background:light-dark(#dff0d8,#1d3320)}
.bh .bp{margin-left:auto;font-weight:600;color:var(--ink)}
.hidden{display:none!important}
.scroll{overflow-x:auto}
@media(max-width:600px){.drop{grid-template-columns:1fr}.locform{grid-template-columns:1fr 1fr}.locform label:first-child{grid-column:1/-1}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div class="hz"></div>
<header class="band"><div class="wrap">
  <h1>Comenzi → verificare și picking</h1>
  <p class="sub">Unul dintre voi încarcă exportul de comenzi, iar toată echipa vede aceeași listă de verificare și același picking pe calupuri și bifează în timp real ce a terminat.</p>
  <div class="drop" id="drop">
    <div><b id="dropT">Trage aici exportul de comenzi (.xlsx)</b><span id="dropS">sau apasă butonul ca să alegi fișierul</span></div>
    <div><input type="file" id="file" accept=".xlsx,.xls,.csv" class="hidden"><button id="pick">Alege fișierul</button></div>
  </div>
  <div class="confirm hidden" id="repl"><span id="replTxt" style="flex-basis:100%"></span><button id="replAdd">Adaugă în continuare</button><button class="ghost" id="replYes">Înlocuiește lista</button><button class="ghost" id="replNo">Anulează</button></div>
  <div class="msg" id="msg"></div>
  <div class="team" id="team"><span class="dot"></span><span id="teamTxt" class="grow">Se pornește…</span>
    <span id="codeBox" class="hidden"><input id="codeIn" placeholder="Codul echipei" autocomplete="off" aria-label="Codul echipei"> <button class="sm" id="codeOk">Intră</button></span>
    <button class="ghost sm hidden" id="codeChg">Schimbă codul</button>
    <label style="display:flex;gap:6px;align-items:center">Numele tău <input id="me" placeholder="ex. Ionuț" style="width:140px;min-height:38px"></label></div>
  <div class="stats hidden" id="stats"></div>
</div></header>

<main class="band" style="padding-top:0"><div class="wrap">
  <div class="bar hidden" id="partBar"><label>Arată<select id="part"></select></label><span class="grow" id="partInfo"></span></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-verif" aria-selected="true">Listă de verificare</button>
    <button role="tab" id="t-pick" aria-selected="false">Picking pe calupuri</button>
    <button role="tab" id="t-loc" aria-selected="false">Locații produse</button>
  </div>

  <section id="p-verif">
    <div class="bar"><span class="grow" id="vInfo"></span>
      <label class="ck"><input type="checkbox" id="vHide"> Doar ce nu e verificat</label>
      <button class="ghost dl" id="dlV">Descarcă Excel</button>
      <button class="ghost dl" id="prV">Pentru printare (.html)</button></div>
    <div id="vBody"></div>
  </section>

  <section id="p-pick" class="hidden">
    <div class="bar">
      <label>Comenzi pe calup<input type="number" id="bsize" min="1" value="20" style="width:110px"></label>
      <label>Ordonare în calup<select id="sort"><option value="nr">după nr. comandă</option><option value="loc">după rând și alveolă</option></select></label>
      <label class="ck"><input type="checkbox" id="pHide"> Doar ce nu e cules</label>
      <span class="grow"></span>
      <button class="ghost dl" id="dlP">Descarcă Excel</button>
      <button class="ghost dl" id="prP">Pentru printare (.html)</button>
    </div>
    <div id="pBody"></div>
  </section>

  <section id="p-loc" class="hidden">
    <form class="locform" id="locForm">
      <label>SKU<input id="lSku" required autocomplete="off" inputmode="numeric"></label>
      <label>Rând<input id="lC" required type="number" min="0"></label>
      <label>Alveolă<input id="lA" required type="number" min="0"></label>
      <button type="submit">Salvează</button>
    </form>
    <div class="msg" id="locMsg"></div>
    <div id="missBox"></div>
    <div class="bar">
      <input id="lq" placeholder="Caută SKU…" class="grow" style="max-width:260px">
      <span class="grow" id="locInfo"></span>
      <button class="ghost sm" id="impBtn">Importă locații (.xlsx)</button>
      <input type="file" id="impFile" accept=".xlsx,.xls,.csv" class="hidden">
      <button class="ghost sm dl" id="dlL">Descarcă toate locațiile</button>
    </div>
    <div id="locBody"></div>
  </section>
</div></main>

function readBook(file){return file.arrayBuffer().then(b=>{const wb=XLSX.read(b,{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})})}
function parse(rows){
  const h=(rows[0]||[]).map(norm);
  const at=(n,o=0)=>{let k=-1;for(let i=0;i<h.length;i++)if(h[i]===n&&++k===o)return i;return -1};
  const C={id:at('id comanda'),canal:at('canal'),prod:at('nume',0),sku:at('sku'),qty:at('cantitate'),client:at('nume',1),firma:at('nume companie'),cf:at('cod fiscal'),deleg:at('nume',2),tel:at('telefon')};
  const lipsa=['id','sku','qty'].filter(k=>C[k]<0);
  if(lipsa.length)throw new Error('Nu găsesc coloanele: '+lipsa.map(k=>({id:'ID comandă',sku:'SKU',qty:'Cantitate'}[k])).join(', '));
  const g=(r,k)=>C[k]<0?'':clean(r[C[k]]);
  const map=new Map(),out=[];
  for(const r of rows.slice(1)){
    const id=g(r,'id');if(!id)continue;
    let o=map.get(id);
    if(!o){o={nr:out.length+1,id,canal:g(r,'canal'),cf:g(r,'cf'),client:g(r,'client'),tel:g(r,'tel'),firma:g(r,'firma'),deleg:g(r,'deleg'),lines:[]};map.set(id,o);out.push(o)}
    for(const k of ['cf','tel','firma','deleg','client'])if(!o[k])o[k]=g(r,k);
    const sku=g(r,'sku'),qty=Number(String(g(r,'qty')).replace(',','.'))||0,prod=g(r,'prod');
    const ex=o.lines.find(l=>l.sku===sku);
    if(ex)ex.qty+=qty;else o.lines.push({sku,qty,prod});
  }
  out.sort((a,b)=>a.canal.localeCompare(b.canal,'ro',{sensitivity:'base'})||a.nr-b.nr);
  out.forEach((o,i)=>o.nr=i+1);
  return out;
}
async function load(file){
  try{
    const list=parse(await readBook(file));
    if(!list.length)throw new Error('Fișierul nu conține comenzi.');
    const name=file.name.replace(/\.[^.]+$/,'');
    say($('msg'),'','');
    if(orders.length){
      const ids=new Set(orders.map(o=>o.id)),nou=list.filter(o=>!ids.has(o.id)).length,dup=list.length-nou,last=maxNr();
      pending={list,name};
      const done=Object.values(prog.v).filter(Boolean).length+Object.values(prog.p).filter(Boolean).length;
      $('replTxt').textContent=`Există deja o listă cu ${orders.length} comenzi${done?` și ${done} bife`:''}. Fișierul „${name}” are ${nou} comenzi noi`+(dup?` (${dup} sunt deja în listă și vor fi sărite)`:'')+'. '+(nou?`„Adaugă în continuare” le numerotează de la ${last+1} la ${last+nou}, fără să atingă ce există.`:'Nu e nimic nou de adăugat.')+' „Înlocuiește lista” o ia de la 1 și șterge bifele.';
      $('replAdd').disabled=!nou;$('replAdd').textContent=nou?`Adaugă în continuare (${last+1}–${last+nou})`:'Adaugă în continuare';
      $('repl').classList.remove('hidden');$('repl').scrollIntoView({block:'nearest'});
    }else await publish(list,name);
  }catch(e){say($('msg'),'Nu am putut citi fișierul: '+e.message,'err')}
}
const maxNr=()=>orders.reduce((m,o)=>Math.max(m,o.nr),0);
const tranches=()=>meta?.tranches?.length?meta.tranches:(orders.length?[{from:1,to:maxNr(),at:meta?.at,by:meta?.by,file:meta?.file}]:[]);
async function writeList(list,m,old){
  const zi=store.col('zi'),CH=150,parts=Math.ceil(list.length/CH),rev=Date.now().toString(36);
  for(let i=0;i<parts;i++)await zi.doc('p'+i).set({listId:m.listId,rev,i,orders:list.slice(i*CH,(i+1)*CH)});
  await zi.doc('meta').set({...m,n:list.length,parts,rev});
  if(old)for(let i=parts;i<(old.parts||0);i++)await zi.doc('p'+i).delete().catch(()=>{});
}
async function publish(list,name){
  $('repl').classList.add('hidden');pending=null;
  const at=Date.now(),m={listId:at.toString(36),file:name,at,by:me(),bsize:bsize(),tranches:[{from:1,to:list.length,at,by:me(),file:name}]};
  list.forEach(o=>o.t=0);$('part').value='all';
  if(!store){orders=list;meta=m;prog={v:{},p:{}};renderAll();return}
  say($('msg'),'Trimit lista către toată echipa…','');
  try{
    const old=meta;await writeList(list,m,old);
    if(old?.listId)await store.col('bife').doc(old.listId).delete().catch(()=>{});
    say($('msg'),`Lista „${name}” e acum la toată echipa.`,'ok');
  }catch(e){say($('msg'),'Lista nu a putut fi trimisă: '+(e.message||e.code),'err')}
}
async function append(list,name){
  $('repl').classList.add('hidden');pending=null;
  const ids=new Set(orders.map(o=>o.id)),start=maxNr(),tr=tranches(),t=tr.length,at=Date.now();
  const nou=list.filter(o=>!ids.has(o.id)).map((o,i)=>({...o,nr:start+i+1,t}));
  if(!nou.length){say($('msg'),'Toate comenzile din fișier sunt deja în listă.','ok');return}
  const all=orders.map(o=>({...o,t:o.t||0})).concat(nou);
  const m={...(meta||{listId:at.toString(36),file:name,at,by:me(),bsize:bsize()}),tranches:[...tr,{from:start+1,to:start+nou.length,at,by:me(),file:name}]};
  const msg=`Am adăugat ${nou.length} comenzi noi, numerotate ${start+1}–${start+nou.length}`+(list.length>nou.length?`; ${list.length-nou.length} erau deja în listă și au fost sărite.`:'.');
  if(!store){orders=all;meta=m;$('part').value=String(t);renderAll();say($('msg'),msg,'ok');return}
  say($('msg'),'Adaug comenzile noi pentru toată echipa…','');
  try{await writeList(all,m,meta);wantPart=String(t);say($('msg'),msg,'ok')}catch(e){say($('msg'),'Comenzile noi nu au putut fi trimise: '+(e.message||e.code),'err')}
}

const bsize=()=>Math.max(1,parseInt($('bsize').value)||20);
const isV=nr=>!!prog.v[nr],isP=(nr,sku)=>!!prog.p[nr+'_'+sku];

function batches(){
  const n=bsize(),out=[],v=$('part').value;let idx=0;
  tranches().forEach((tr,t)=>{
    const os=orders.filter(o=>(o.t||0)===t);
    for(let i=0;i<os.length;i+=n){
      const ch=os.slice(i,i+n);idx++;
      if(v!=='all'&&v&&String(t)!==v)continue;
      let lines=ch.flatMap(o=>o.lines.map(l=>({...l,nr:o.nr,loc:loc(l.sku)})));
      if($('sort').value==='loc')lines.sort((a,b)=>(a.loc?0:1)-(b.loc?0:1)||(a.loc&&b.loc?(a.loc.c-b.loc.c)||(a.loc.a-b.loc.a):0)||a.nr-b.nr);
      out.push({idx,t,from:ch[0].nr,to:ch[ch.length-1].nr,lines});
    }
  });
  return out;
}

const verifRows=()=>vis().flatMap(o=>o.lines.map((l,k)=>({o,l,k})));
function renderVerif(){
  if(!orders.length){$('vBody').innerHTML=EMPTY;$('vInfo').textContent='';return}
  const O=vis(),multi=O.filter(o=>o.lines.length>1).length,hide=$('vHide').checked;
  $('vInfo').textContent=`${(()=>{const v=$('part').value,tr=tranches();const f=v==='all'||!v?(tr.length>1?'toate listele':meta?.file):tr[+v]?.file;return f?(tr.length>1&&v==='all'?f:'„'+f+'”')+' · ':''})()}${O.length} comenzi sortate după canal`+(multi?` · ${multi} cu mai multe produse (fundal galben)`:'');
  const rows=verifRows().filter(r=>!hide||!isV(r.o.nr));
  $('vBody').innerHTML=rows.length?`<div class="scroll"><table class="stack"><thead><tr><th>Verificat</th>${VCOLS.map((h,i)=>`<th class="${i===3||i===6?'n':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(({o,l,k})=>`<tr class="${k===0&&o.nr>1?'grp':''}${o.lines.length>1?' mlt':''}${isV(o.nr)?' done':''}"><td>${ck('v',o.nr,prog.v[o.nr],'Comanda '+o.nr+' verificată')}</td><td>${esc(o.canal)}</td><td>${esc(o.cf)}</td><td>${esc(o.id)}</td><td class="nr n">${o.nr}</td><td>${esc(o.client)}</td><td>${esc(l.sku)}</td><td class="n"><b>${l.qty}</b></td><td class="prod">${esc(l.prod)}</td><td style="white-space:nowrap">${esc(o.tel)}</td><td>${esc(o.firma)}</td><td>${esc(o.deleg)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Toate comenzile sunt verificate.</div>';
}
function renderPick(){
  if(!orders.length){$('pBody').innerHTML=EMPTY;return}
  const hide=$('pHide').checked;
  $('pBody').innerHTML=batches().map(b=>{const i=b.idx-1;
    const buc=b.lines.reduce((s,l)=>s+l.qty,0),dn=b.lines.filter(l=>isP(l.nr,l.sku)).length,full=dn===b.lines.length;
    if(hide&&full)return '';
    let prev=null;const ls=b.lines.filter(l=>!hide||!isP(l.nr,l.sku));
    return `<div class="batch${full?' done':''}"><div class="bh"><h2>Calup ${i+1}</h2><span>comenzile ${b.from}–${b.to} · ${b.lines.length} linii · ${buc} bucăți</span><span class="bp">${full?'Cules complet':`${dn}/${b.lines.length} culese`}</span></div><div class="scroll"><table class="stack"><thead><tr><th>Cules</th><th class="n">Nr. comandă</th><th>SKU</th><th class="n">Cantitate</th><th>Denumire</th><th>Rând</th><th>Alveolă</th></tr></thead><tbody>${ls.map(l=>{const g=$('sort').value==='nr'&&prev!==null&&prev!==l.nr;prev=l.nr;const key=l.nr+'_'+l.sku;return `<tr class="${g?'grp':''}${isP(l.nr,l.sku)?' done':''}"><td>${ck('p',key,prog.p[key],'Cules')}</td><td class="nr">${l.nr}</td><td>${esc(l.sku)}</td><td class="n"><b>${l.qty}</b></td><td class="prod">${esc(l.prod)}</td>${l.loc?`<td><span class="tag">R ${esc(l.loc.c)}</span></td><td><span class="tag">A ${esc(l.loc.a)}</span></td>`:`<td colspan="2"><span class="miss">fără locație</span> <button class="ghost sm addl" data-sku="${esc(l.sku)}">Adaugă</button></td>`}</tr>`}).join('')}</tbody></table></div></div>`;
  }).join('')||'<div class="empty">Totul e cules.</div>';
}
function renderMiss(){
  const m=missing();
  if(!m.length){$('missBox').innerHTML=orders.length?'<p class="msg ok">Toate produsele din lista de azi au locație.</p>':'';return}
  $('missBox').innerHTML=`<div class="batch"><div class="bh"><h2>Fără locație în lista de azi</h2><span>${m.length} SKU — completează rândul și alveola și apasă Salvează</span></div><table class="stack"><thead><tr><th>SKU</th><th>Denumire</th><th>Rând</th><th>Alveolă</th><th></th></tr></thead><tbody>${m.map(x=>`<tr class="mrow"><td><b>${esc(x.sku)}</b></td><td class="prod">${esc(x.prod)}</td><td><input type="number" min="0" aria-label="Rând"></td><td><input type="number" min="0" aria-label="Alveolă"></td><td><button class="sm savem" data-sku="${esc(x.sku)}">Salvează</button></td></tr>`).join('')}</tbody></table></div>`;
}
function renderLoc(){
  const q=$('lq').value.trim();
  const added=[...extra.entries()].map(([s,l])=>({s,...l,added:true}));
  let list;
  if(q){const all=new Map([...base].map(([s,l])=>[s,{s,...l,added:false}]));for(const a of added)all.set(a.s,a);list=[...all.values()].filter(x=>x.s.includes(q)).slice(0,200)}
  else list=added.sort((a,b)=>(b.t||0)-(a.t||0));
  $('locInfo').textContent=`${base.size} locații din fișierul inițial · ${extra.size} adăugate sau modificate`;
  $('locBody').innerHTML=list.length?`<table class="stack"><thead><tr><th>SKU</th><th>Locație</th><th>Sursă</th><th></th></tr></thead><tbody>${list.map(x=>`<tr><td><b>${esc(x.s)}</b></td><td>${tag(x)}</td><td>${x.added?(base.has(x.s)?'modificată':'adăugată')+(x.n?' de '+esc(x.n):''):'fișierul inițial'}</td><td style="white-space:nowrap"><button class="ghost sm edl" data-sku="${esc(x.s)}">Modifică</button>${x.added?` <button class="ghost sm dell" data-sku="${esc(x.s)}">Șterge</button>`:''}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${q?'Niciun SKU găsit.':'Încă nu s-au adăugat locații. Cele noi apar aici.'}</div>`;
}
function renderAll(){renderParts();renderStats();renderVerif();renderPick();renderMiss();renderLoc()}

/* ---------- bife ---------- */
async function tick(k,key,on){
  const val=on?{n:me(),t:Date.now()}:null;
  prog={...prog,[k]:{...prog[k],[key]:val}};renderAll();
  if(!store||!meta)return;
  try{await merge(store.col('bife').doc(meta.listId),{[k]:{[key]:val}})}catch(e){say($('msg'),'Bifa nu s-a salvat: '+(e.message||e.code),'err')}
}

/* ---------- locații ---------- */
function saveLocal(){ls.set('locatii_extra',JSON.stringify([...extra]))}
async function putLoc(sku,c,a){
  sku=clean(sku);if(!sku)throw new Error('SKU lipsă');
  const v={c:Number(c),a:Number(a),t:Date.now(),n:me()};
  if(!Number.isFinite(v.c)||!Number.isFinite(v.a))throw new Error('Rândul și alveola trebuie să fie numere');
  extra.set(sku,v);
  if(store)await store.col('locatii').doc(docId(sku)).set({sku,...v});else saveLocal();
}
async function delLoc(sku){extra.delete(sku);if(store)await store.col('locatii').doc(docId(sku)).delete();else saveLocal()}
async function act(fn,okText){try{await fn();say($('locMsg'),okText,'ok')}catch(e){say($('locMsg'),'Nu s-a salvat: '+(e.message||e.code||e),'err')}renderAll()}

/* ---------- exporturi ---------- */
function sheet(aoa,w){const s=XLSX.utils.aoa_to_sheet(aoa);s['!cols']=w.map(x=>({wch:x}));return s}
const verifAoa=()=>[VCOLS,...verifRows().map(({o,l})=>[o.canal,o.cf,o.id,o.nr,o.client,l.sku,l.qty,l.prod,o.tel,o.firma,o.deleg])];
const pickAoa=b=>[['Nr. comandă','SKU','Cantitate','Denumire','Rând','Alveolă'],...b.lines.map(l=>[l.nr,l.sku,l.qty,l.prod,l.loc?l.loc.c:'FĂRĂ',l.loc?l.loc.a:'LOCAȚIE'])];
const xbuf=wb=>new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'}));
async function save(name,data){
  if(!dl){const u=URL.createObjectURL(new Blob([data])),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return}
  try{await dl.save({filename:name,data})}catch(e){if(e.code!=='declined')say($('msg'),'Descărcarea nu a mers: '+(e.message||e.code),'err')}
}
const stamp=()=>new Date().toISOString().slice(0,10);
function printDoc(title,body){return `<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font:12px Arial,sans-serif;margin:12mm}h2{font-size:16px;margin:0 0 6px}table{border-collapse:collapse;width:100%;margin-bottom:10px}th,td{border:1px solid #444;padding:4px 6px;text-align:left;vertical-align:top}th{background:#eee}.n{text-align:right}.b{font-weight:bold;font-size:14px}.pb{page-break-after:always}.pb:last-child{page-break-after:auto}@page{margin:10mm;size:landscape}</style></head><body>${body}<script>window.onload=()=>window.print()<\/script></body></html>`}
function tbl(aoa,nums){return `<table><thead><tr>${aoa[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${aoa.slice(1).map(r=>`<tr>${r.map((c,i)=>`<td class="${nums.includes(i)?'n b':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}

/* ---------- evenimente ---------- */
const drop=$('drop');
$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>{if(e.target.files[0])load(e.target.files[0]);e.target.value=''};
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)load(f)});
$('replYes').onclick=()=>{if(pending)publish(pending.list,pending.name)};
$('replAdd').onclick=()=>{if(pending)append(pending.list,pending.name)};
$('part').onchange=()=>{renderStats();renderVerif();renderPick()};
$('replNo').onclick=()=>{pending=null;$('repl').classList.add('hidden')};
const tabs=['verif','pick','loc'];
function show(t){for(const x of tabs){$('t-'+x).setAttribute('aria-selected',x===t);$('p-'+x).classList.toggle('hidden',x!==t)}}
for(const x of tabs)$('t-'+x).onclick=()=>show(x);
$('bsize').oninput=()=>{renderStats();renderPick()};
$('bsize').onchange=()=>{if(store&&meta)merge(store.col('zi').doc('meta'),{bsize:bsize()}).catch(()=>{})};
$('sort').onchange=renderPick;
$('vHide').onchange=renderVerif;$('pHide').onchange=renderPick;
$('lq').oninput=renderLoc;
$('me').value=ls.get('nume')||'';$('me').oninput=()=>ls.set('nume',me());
document.addEventListener('change',e=>{const c=e.target;if(c.matches('input[data-k]'))tick(c.dataset.k,c.dataset.key,c.checked)});
$('locForm').onsubmit=e=>{e.preventDefault();const s=$('lSku').value;act(()=>putLoc(s,$('lC').value,$('lA').value),'Locație salvată pentru '+clean(s)+'.');$('lSku').value=$('lC').value=$('lA').value='';$('lSku').focus()};
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const sku=b.dataset.sku;
  if(b.classList.contains('addl')){show('loc');$('lSku').value=sku;$('lC').focus()}
  else if(b.classList.contains('savem')){const ins=b.closest('tr').querySelectorAll('input');if(ins[0].value===''||ins[1].value===''){say($('locMsg'),'Completează rândul și alveola pentru '+sku+'.','err');return}act(()=>putLoc(sku,ins[0].value,ins[1].value),'Locație salvată pentru '+sku+'.')}
  else if(b.classList.contains('edl')){const l=loc(sku);$('lSku').value=sku;$('lC').value=l?l.c:'';$('lA').value=l?l.a:'';$('lC').focus();window.scrollTo({top:$('locForm').offsetTop-20})}
  else if(b.classList.contains('dell'))act(()=>delLoc(sku),'Am șters locația adăugată pentru '+sku+(base.has(sku)?' (rămâne cea din fișierul inițial).':'.'));
});
$('dlV').onclick=()=>{if(!orders.length)return;const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet(verifAoa(),[14,14,24,7,28,12,9,60,16,26,24]),'Verificare');save(`verificare_${stamp()}.xlsx`,xbuf(wb))};
$('dlP').onclick=()=>{if(!orders.length)return;const wb=XLSX.utils.book_new();for(const b of batches())XLSX.utils.book_append_sheet(wb,sheet(pickAoa(b),[12,12,10,70,8,9]),`${b.from}-${b.to}`);save(`picking_${stamp()}.xlsx`,xbuf(wb))};
$('prV').onclick=()=>{if(!orders.length)return;save(`verificare_${stamp()}.html`,printDoc('Listă de verificare',`<h2>Listă de verificare · ${vis().length} comenzi · ${esc(meta?.file||'')}</h2>`+tbl(verifAoa(),[3,6])))};
$('prP').onclick=()=>{if(!orders.length)return;save(`picking_${stamp()}.html`,printDoc('Picking',batches().map(b=>`<div class="pb"><h2>Calup ${b.idx} · comenzile ${b.from}–${b.to}</h2>${tbl(pickAoa(b),[0,2,4,5])}</div>`).join('')))};
$('dlL').onclick=()=>{const all=new Map([...base].map(([s,l])=>[s,l]));for(const [s,l] of extra)all.set(s,l);const aoa=[['Cod','Culoar','Alveola'],...[...all].map(([s,l])=>[/^\d+$/.test(s)?Number(s):s,l.c,l.a])];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet(aoa,[14,8,8]),'Locatii');save(`locatii_${stamp()}.xlsx`,xbuf(wb))};
$('impBtn').onclick=()=>$('impFile').click();
$('impFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const rows=await readBook(f),h=(rows[0]||[]).map(norm);
    const ci=h.findIndex(x=>x==='cod'||x==='sku'),cc=h.findIndex(x=>x==='culoar'||x==='rand'),ca=h.findIndex(x=>x==='alveola');
    if(ci<0||cc<0||ca<0)throw new Error('trebuie coloanele Cod (sau SKU), Culoar (sau Rând) și Alveola');
    const ch=rows.slice(1).map(r=>[clean(r[ci]),Number(r[cc]),Number(r[ca])]).filter(r=>r[0]&&Number.isFinite(r[1])&&Number.isFinite(r[2])).filter(r=>{const l=loc(r[0]);return !l||l.c!==r[1]||l.a!==r[2]});
    if(!ch.length){say($('locMsg'),'Fișierul nu aduce nicio locație nouă sau schimbată.','ok');return}
    say($('locMsg'),`Salvez ${ch.length} locații…`,'');
    for(const r of ch)await putLoc(r[0],r[1],r[2]);
    say($('locMsg'),`Am importat ${ch.length} locații noi sau schimbate.`,'ok');
  }catch(err){say($('locMsg'),'Importul nu a mers: '+(err.message||err.code),'err')}
  renderAll();
};

/* ---------- sincronizare ---------- */
function goLocal(t){store=null;try{extra=new Map(JSON.parse(ls.get('locatii_extra')||'[]'))}catch(e){}team(t,false);renderAll()}
function connect(st,label){
  store=st;team('Se conectează la lista echipei…',false);
  const timer=setTimeout(()=>team('Lista echipei nu răspunde încă. Verifică internetul.',false),10000);
  const fail=e=>{clearTimeout(timer);goLocal('Nu pot ajunge la datele echipei ('+(e.code||e.message)+'). Lucrezi doar pe acest calculator.')};
  let firstLoc=true;
  store.col('locatii').onSnapshot(s=>{
    const m=new Map();for(const d of s.docs){const x=d.data();if(x&&x.sku)m.set(String(x.sku),{c:x.c,a:x.a,t:x.t,n:x.n})}
    extra=m;
    if(firstLoc&&!s.metadata.fromCache){firstLoc=false;let l0=[];try{l0=JSON.parse(ls.get('locatii_extra')||'[]')}catch(e){}
      const up=l0.filter(([k])=>!m.has(k));if(up.length)(async()=>{for(const [k,v] of up){try{await putLoc(k,v.c,v.a)}catch(e){}}ls.set('locatii_extra',null)})()}
    renderAll();
  },fail);
  store.col('zi').onSnapshot(s=>{
    const d=new Map(s.docs.map(x=>[x.id,x.data()]));const m=d.get('meta');
    if(!s.metadata.fromCache){clearTimeout(timer);team(label,true)}
    if(!m){orders=[];meta=null;renderAll();return}
    const parts=[];for(let i=0;i<m.parts;i++){const p=d.get('p'+i);if(!p||p.listId!==m.listId||p.rev!==m.rev)return;parts.push(...p.orders)}
    const changed=!meta||meta.listId!==m.listId;
    meta=m;orders=parts;
    if(m.bsize&&document.activeElement!==$('bsize'))$('bsize').value=m.bsize;
    const nt=(m.tranches||[]).length;$('dropT').textContent=nt>1?`Lista comună: ${nt} liste, comenzile 1–${m.tranches[nt-1].to}`:`Lista comună: ${m.file||'fără nume'}`;
    const lt=nt?m.tranches[nt-1]:m;$('dropS').textContent=`${nt>1?'ultima adăugată':'încărcată'}${lt.by?' de '+lt.by:''} la ${hhmm(lt.at)} · trage următorul fișier ca să-l adaugi în continuare`;
    if(changed){if(bifeOff)bifeOff();prog={v:{},p:{}};
      bifeOff=store.col('bife').doc(m.listId).onSnapshot(b=>{const x=b.exists?b.data():{};prog={v:x.v||{},p:x.p||{}};renderAll()},()=>{})}
    renderAll();
  },fail);
}
renderAll();
if(window.claude){
  (async()=>{try{dl=await claude.use('downloads')}catch(e){dl=null}})();
  (async()=>{
    let db=null;try{db=await claude.use('db')}catch(e){}
    if(!db)return goLocal('Lucrezi doar pe acest calculator (datele echipei nu sunt disponibile aici).');
    connect({kind:'claude',col:n=>db.collection(n)},'Conectat: toți cei care deschid pagina văd aceeași listă și aceleași bife.');
  })();
}else if(FIREBASE_CONFIG){
  const h=decodeURIComponent(location.hash.slice(1));
  if(/^[A-Za-z0-9_-]{10,}$/.test(h)){ls.set('cod_echipa',h);history.replaceState(null,'',location.pathname)}
  const code=ls.get('cod_echipa');
  $('codeChg').onclick=()=>{ls.set('cod_echipa',null);location.reload()};
  $('codeOk').onclick=()=>{const c=clean($('codeIn').value);if(!/^[A-Za-z0-9_-]{10,}$/.test(c)){team('Codul echipei nu e corect.',false);return}ls.set('cod_echipa',c);location.reload()};
  if(!code){$('codeBox').classList.remove('hidden');goLocal('Scrie codul echipei ca să vezi lista comună.')}
  else{
    $('codeChg').classList.remove('hidden');team('Se pornește sincronizarea…',false);
    const V='10.12.2',ld=src=>new Promise((ok,bad)=>{const t=document.createElement('script');t.src=src;t.onload=ok;t.onerror=bad;document.head.appendChild(t)});
    (async()=>{
      try{await ld(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);await ld(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`)}
      catch(e){return goLocal('Nu am putut încărca sincronizarea. Lucrezi doar pe acest calculator.')}
      const fs=(firebase.apps[0]||firebase.initializeApp(FIREBASE_CONFIG)).firestore();
      connect({kind:'fb',col:n=>fs.collection(`teams/${code}/${n}`)},'Conectat la echipă: toți văd aceeași listă și aceleași bife, în timp real.');
    })();
  }
}else goLocal('Sincronizarea nu e configurată încă: lucrezi doar pe acest calculator.');
}
</script>
